<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Western Region History Museum — Virtual Ribbon Cutting</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { font-family: Georgia, 'Times New Roman', serif; background:#FDF9EE; overflow:hidden; }
  #museumFrame { position:fixed; inset:0; width:100%; height:100%; border:0; background:#FDF9EE; }
  #ribbonOverlay { position:fixed; inset:0; z-index:10; background:#FDF9EE;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:opacity 1.1s ease; }
  #ribbonOverlay.gone { opacity:0; pointer-events:none; }
  #logoImg { width:min(300px, 55vw); height:auto; margin-bottom:4vh;
    background:#ffffff; padding:16px 20px; border-radius:12px;
    box-shadow:0 12px 32px rgba(23,38,94,.20), 0 2px 8px rgba(23,38,94,.12); }
  #ribbonScene { position:relative; width:100%; height:260px; }
  .ribbonHalf { position:absolute; top:74px; height:88px; width:50%;
    background:
      linear-gradient(100deg, rgba(125,151,232,0) 28%, rgba(125,151,232,.38) 48%, rgba(125,151,232,0) 64%),
      linear-gradient(180deg, #4668cf 0%, #2b4fc4 26%, #2041A5 52%, #2b4fc4 76%, #16296b 100%);
    border-top:4px solid #DFB136; border-bottom:4px solid #DFB136;
    box-shadow:0 16px 32px rgba(23,38,94,.35), inset 0 3px 8px rgba(190,205,255,.45), inset 0 -12px 20px rgba(10,20,60,.40);
    transition:transform 1.4s cubic-bezier(.5,0,.8,.4), opacity 1.4s ease; }
  #ribbonLeft { left:0; transform-origin:left center; }
  #ribbonRight { right:0; transform-origin:right center; }
  .cut #ribbonLeft { transform:translateY(46vh) rotate(-24deg); opacity:0; }
  .cut #ribbonRight { transform:translateY(46vh) rotate(24deg); opacity:0; }
  #bow { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:250px; height:170px;
    transition:transform 1.2s cubic-bezier(.5,0,.8,.4), opacity 1.2s ease; z-index:2; }
  .cut #bow { transform:translate(-50%, 42vh) rotate(18deg); opacity:0; }
  .loop { position:absolute; top:6px; width:118px; height:96px; border:6px solid #a8842a; border-radius:50%;
    background:radial-gradient(ellipse at 50% 36%, #f9e69b 0%, #efd27e 34%, #DFB136 62%, #b8912a 100%);
    box-shadow:inset 0 -16px 26px rgba(138,106,28,.55), inset 0 12px 20px rgba(255,246,200,.65), 0 12px 24px rgba(23,38,94,.30); }
  #loopL { left:0; transform:rotate(-26deg); }
  #loopR { right:0; transform:rotate(26deg); }
  #knot { position:absolute; left:50%; top:54px; transform:translate(-50%,-50%); width:46px; height:46px;
    border-radius:10px; border:2px solid #a8842a;
    background:linear-gradient(145deg, #f9e69b 0%, #DFB136 55%, #b8912a 100%);
    box-shadow:0 4px 10px rgba(23,38,94,.35), inset 0 2px 5px rgba(255,255,255,.65); z-index:3; }
  .tail { position:absolute; top:112px; width:36px; height:104px;
    background:linear-gradient(180deg, #efd27e 0%, #DFB136 55%, #c49a28 100%);
    border:2px solid #a8842a; border-top:none;
    clip-path:polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
    filter:drop-shadow(0 10px 12px rgba(23,38,94,.30)); transform-origin:top center; }
  #tailL { left:72px; transform:rotate(13deg); }
  #tailR { right:72px; transform:rotate(-13deg); }
  #resetBtn { position:fixed; right:14px; bottom:14px; z-index:20;
    font-family:Georgia, 'Times New Roman', serif; font-size:12.5px; letter-spacing:.03em;
    color:#2041A5; background:rgba(253,249,238,.85); border:1px solid rgba(32,65,165,.45);
    border-radius:999px; padding:6px 13px; cursor:pointer; opacity:.55; }
  #resetBtn:hover, #resetBtn:focus-visible { opacity:1; outline:2px solid #2041A5; outline-offset:2px; }
  #museumName { margin-top:4vh; color:#2041A5; font-size:clamp(26px, 4.6vw, 52px);
    letter-spacing:.04em; text-align:center; padding:0 16px; }
  #openText { margin-top:2.5vh; color:#2041A5; font-size:clamp(24px, 4vw, 44px); text-align:center;
    padding:0 16px; opacity:0; transform:translateY(10px); transition:opacity .8s ease, transform .8s ease; }
  .cut #openText { opacity:1; transform:translateY(0); }
  #cutBtn { margin-top:4.5vh; width:92px; height:92px; border-radius:50%; border:3px solid #b8912a;
    background:radial-gradient(circle at 35% 30%, #f7e08e 0%, #DFB136 65%, #c49a28 100%);
    color:#2041A5; font-size:44px; line-height:1; cursor:pointer; box-shadow:0 8px 20px rgba(32,65,165,.35); }
  #cutBtn:hover { transform:scale(1.05); }
  #cutBtn:focus-visible { outline:3px solid #2041A5; outline-offset:4px; }
  .cut #cutBtn { opacity:0; pointer-events:none; transition:opacity .4s ease; }
  .confetti { position:absolute; top:-4vh; z-index:3; pointer-events:none; }
  @keyframes fall { to { transform:translateY(112vh) rotate(680deg); } }
</style>
</head>

  <div id="ribbonScene">
    <div class="ribbonHalf" id="ribbonLeft"></div>
    <div class="ribbonHalf" id="ribbonRight"></div>
    <div id="bow">
      <div class="loop" id="loopL"></div>
      <div class="loop" id="loopR"></div>
      <div class="tail" id="tailL"></div>
      <div class="tail" id="tailR"></div>
      <div id="knot"></div>
    </div>
  </div>
  <div id="museumName">The Western Region History Museum</div>
  <button id="cutBtn" aria-label="Cut the ribbon">&#9986;</button>
  <div id="openText">The Western Region History Museum Is Open</div>
</div>
<button id="resetBtn" type="button">Reset ribbon for rehearsal</button>

<script>
  var overlay = document.getElementById('ribbonOverlay');
  var fadeTimer = null, hideTimer = null;
  document.getElementById('cutBtn').addEventListener('click', function () {
    if (overlay.classList.contains('cut')) return;
    overlay.classList.add('cut');
    var colors = ['#DFB136', '#efd27e', '#b8912a', '#f3d67c'];
    for (var i = 0; i < 110; i++) {
      var c = document.createElement('div');
      c.className = 'confetti';
      var size = 6 + Math.random() * 8;
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.width = size + 'px';
      c.style.height = (size * 0.5) + 'px';
      c.style.background = colors[i % colors.length];
      c.style.animation = 'fall ' + (2.2 + Math.random() * 1.8) + 's ease-in ' + (Math.random() * 0.7) + 's forwards';
      overlay.appendChild(c);
    }
    fadeTimer = setTimeout(function () { overlay.classList.add('gone'); }, 3400);
    hideTimer = setTimeout(function () { overlay.style.display = 'none'; }, 4700);
  });
  document.getElementById('resetBtn').addEventListener('click', function () {
    if (fadeTimer) { clearTimeout(fadeTimer); fadeTimer = null; }
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    overlay.style.display = '';
    overlay.classList.remove('gone');
    overlay.classList.remove('cut');
    var cs = overlay.querySelectorAll('.confetti');
    for (var i = 0; i < cs.length; i++) { cs[i].remove(); }
  });
</script>
